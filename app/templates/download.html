{% extends "base.html" %}
{% block title %}Your video · {{ site_name }}{% endblock %}
{% block content %}
<section class="card">
  <h1>{{ order.template_label }} · {{ order.address or order.city }}</h1>
  {% for tag, label in files %}
  <div class="video-block">
    <video src="/v/{{ order.id }}/{{ tag }}.mp4" controls playsinline preload="metadata" class="video-{{ tag }}"></video>
    <a class="btn btn-primary" href="/v/{{ order.id }}/{{ tag }}.mp4?download=true">Download {{ label }}</a>
  </div>
  {% endfor %}
</section>
{% endblock %}
